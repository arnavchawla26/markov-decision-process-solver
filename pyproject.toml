[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpsolve"
version = "0.1.0"
description = "Value iteration, policy iteration, and tabular Q-learning from scratch on gridworld MDPs, with a CLI to define, solve, and animate a grid."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mdpsolve = "mdpsolve.cli:main"

[tool.setuptools]
packages = ["mdpsolve"]
